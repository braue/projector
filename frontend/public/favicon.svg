<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Projector">
  <!-- What the app is: one tree where every file keeps its versions. Three
       stacked sheets, the front one the version you're on, marked with a
       breaker-red dot. Ground is projector's own accent blue so it reads on a
       dark taskbar as well as a light one. -->
  <rect width="48" height="48" rx="11" fill="#2b46e8"/>
  <rect x="19" y="7" width="20" height="26" rx="3" fill="#ffffff" opacity="0.35"/>
  <rect x="14.5" y="10.5" width="20" height="26" rx="3" fill="#ffffff" opacity="0.62"/>
  <rect x="10" y="14" width="20" height="26" rx="3" fill="#ffffff"/>
  <g stroke="#2b46e8" stroke-width="2.4" stroke-linecap="round">
    <line x1="14.5" y1="21" x2="25.5" y2="21"/>
    <line x1="14.5" y1="26.5" x2="22" y2="26.5"/>
  </g>
  <circle cx="24.5" cy="34" r="2.6" fill="#e5352b"/>
</svg>
