<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Projector">
  <!-- What the app actually does: devices on a canvas with the links between
       them drawn in. A hub with three legs is also the shape of the thing it
       is usually looking at — an RTAC with relays hanging off it.
       Accent ground so it reads on a dark taskbar as well as a light one;
       colours are projector's own --accent and --card. The legs are longer
       than they look like they need to be: at 16px the links are the first
       thing to disappear, and without them this is just four dots. -->
  <rect width="48" height="48" rx="11" fill="#10a37f"/>
  <g stroke="#ffffff" stroke-width="2.9" stroke-linecap="round">
    <line x1="24" y1="26.5" x2="24" y2="12.5"/>
    <line x1="24" y1="26.5" x2="12.2" y2="33.4"/>
    <line x1="24" y1="26.5" x2="35.8" y2="33.4"/>
  </g>
  <g fill="#ffffff">
    <circle cx="24" cy="26.5" r="5.4"/>
    <circle cx="24" cy="11.6" r="3.8"/>
    <circle cx="11.4" cy="33.9" r="3.8"/>
    <circle cx="36.6" cy="33.9" r="3.8"/>
  </g>
</svg>
